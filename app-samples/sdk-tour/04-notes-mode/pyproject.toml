# What this sample needs from the repository and from PyPI. Run from this directory with
# `uv run ...` (see ../README.md); uv installs exactly this.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-app-sample-notes-mode"
version = "0.1.0"
description = "xr-ai-app sample 04: A router with a sticky notes mode."
requires-python = ">=3.11,<3.15"
dependencies = [
    "xr-ai-kit",
    "xr-ai-app",
]

[tool.uv.sources]
xr-ai-kit       = { path = "../../../app-sdk/xr-ai-kit", editable = true }
xr-ai-app       = { path = "../../../app-sdk/xr-ai-app", editable = true }

[project.scripts]
notes_mode_app = "app:app.run"

[tool.hatch.build.targets.wheel]
only-include = ["app.py"]
