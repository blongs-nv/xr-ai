# The model profile is shared by every sample.
profile: ../models.json
# Packets land in artifacts/<participant>/sessions/<session-id>/.
artifacts_dir: artifacts
voice:
  voice_gate_yaml: ../yaml/voice_gate.yaml  # upstream conversation-example's
  # Acknowledgements queue; they never cut each other off.
  interrupt_on_supersede: false
  vad:
    # As upstream's worker sets it.
    silence_duration: 0.4
    min_speech: 0.1
    silero_threshold: 0.5
    # Wait for the final transcript: a partial "stop" must not cut narration.
    stop_probe_after_s: 0
settings:
  frames_per_s: 2.0
  caption_every_s: 5.0
