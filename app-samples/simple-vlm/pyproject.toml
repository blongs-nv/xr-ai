# One uv project for the launcher (main.py: DeviceIOHub + the app) and the
# app (app.py). Run from this directory; see README.md.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-app-sample-simple-vlm"
version = "0.1.0"
description = "Voice and text questions about the current camera view, on the xr-ai-app core."
requires-python = ">=3.11,<3.15"
dependencies = [
    "xr-ai-launcher",
    "xr-ai-logging",
    "xr-ai-app",
]

[dependency-groups]
# `uv run pytest`
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.uv.sources]
xr-ai-launcher = { path = "../../utils/xr-ai-launcher", editable = true }
xr-ai-logging  = { path = "../../utils/xr-ai-logging", editable = true }
xr-ai-app      = { path = "../../app-sdk/xr-ai-app", editable = true }

[project.scripts]
simple_vlm = "main:run"
simple_vlm_app = "app:main"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "app.py"]
