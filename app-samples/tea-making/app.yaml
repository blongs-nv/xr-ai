# yaml/ holds the tea sample's hub, gate and capture files (upstream's) and
# its model profile (roles by job: perceive, answer_with_reasoning, decide,
# speech_out).
profile: yaml/models.json
# Each run's record: artifacts/<participant>/sop-tea.jsonl.
artifacts_dir: artifacts
voice:
  voice_gate_yaml: yaml/voice_gate.yaml
  # Voice activity detection, as the upstream tea worker sets it.
  vad: {silence_duration: 1.2, min_speech: 0.15, silero_threshold: 0.3}

settings:
  # Frame freshness for "what do you see?": an older frame is stale; then the
  # app asks for a picture or waits this long for the next frame.
  frame_max_age_s: 3.0
  frame_timeout_s: 5.0
  dialogue_budget_bytes: 6000
  # Dialogue the router sends with each routing decision.
  routing_history_budget_bytes: 6000
  tea:
    # How the package is read (xr_ai_kit.sop.ReadSettings): frame after frame
    # (`interval_s` 0: the next new frame as soon as the last is read);
    # `model_timeout_s` bounds one model call.
    read:
      interval_s: 0.0
      model_timeout_s: 30.0
    # How the camera steps watch (xr_ai_kit.sop.WatchSettings): a step
    # completes on `required` positives among the last `window` decidable
    # frames, looking every `interval_s` seconds; `model_timeout_s` bounds
    # one model call.
    watch:
      required: 2
      window: 4
      interval_s: 2.0
      model_timeout_s: 30.0
    # Each camera step's escalator (xr_ai_kit.sop.EscalationSettings): when
    # the check is stuck it asks the person or tells them what to show.
    # It reads the procedure's summary and the conversation when it decides
    # what to say, and reads the conversation into the facts the step
    # accepts (the kettle's unit) as the step starts and each time it
    # changes, so what the person says reaches the check without anyone
    # asking. It looks every `every_s` seconds and says at most `max_lines`.
    escalation:
      reads_run_summary: true
      reads_conversation: true
      learns_from_conversation: true
      every_s: 20.0
      max_lines: 2
