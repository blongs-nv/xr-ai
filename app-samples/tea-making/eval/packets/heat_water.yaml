# Heating the water to 80 C (176 on this kettle's Fahrenheit display).
step: heat_water
state:
  steps: {identify: done, fill_water: done, heat_water: running}
  detail: "running: 0 of 2 confirmations in the last 4. Latest: negative: {\"value\":131.0,\"unit_text\":\"°\"}"
  noted: {tea: {tea_name: Bigelow, tea_type: green tea}, temperature_c: 80, duration_s: 120, settings_from: recommended}
frames:
  # The display prints no unit, so the check reports unknown. The side
  # escalation, reading those reports every 20 s, should ask the person
  # which unit the kettle uses within the first couple of minutes.
  - name: rising_unit_unknown
    at: [26, 130]
    expect: not_done
    escalates: ask
    about: [unit, celsius, fahrenheit]
  # After the person said Fahrenheit: decidable, so nothing to say.
  - {name: rising, at: [26, 321], expect: not_done, facts: {unit: fahrenheit}, escalates: none}
  # Spliced: heating in view, then the person looks away from the kettle
  # (the tea packet close up, then opening the tea bag) for about 40 s. The
  # check stops deciding; the escalation should tell them to bring the
  # kettle's display back into view, not ask about the unit (known).
  - name: looked_away
    at: [[26, 36], [5, 12], [5, 12], [5, 12], [346, 351], [346, 351]]
    expect: not_done
    facts: {unit: fahrenheit}
    escalates: tell
    about: [kettle, display, view]
  - {name: at_target, at: [339, 346], expect: done, facts: {unit: fahrenheit}}
  - name: setpoint_flash
    at: [22.5, 25.5]
    expect: not_done
    facts: {unit: fahrenheit}
    why: 176 is the kettle's target setting while the button is pressed
  - name: label_held_up
    at: [4, 16]
    expect: not_done
  - name: steeping_kettle_still_hot
    at: [364, 381]
    expect: either
    why: the kettle reads 176-182 at the edge of the view
utterances:
  - say: Is the water hot enough yet?
    expect: {route: [observation, conversation]}
  - say: How long will it take to heat up?
    expect: {route: conversation}
  - say: What temperature are we waiting for?
    expect: {route: conversation, answer: {mentions: ["80", "176"]}}
  - say: How long is left on the timer?
    expect: {route: conversation, answer: {not: [seconds left, minutes left]}}  # no timer yet
