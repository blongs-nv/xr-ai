# One recording of someone making green tea: a 381 s first-person video. The
# recording and its frames are not in the repository; pass their local
# index to run_steps.py (--frames-index). The step cases refer to its
# frames by time (seconds from the start).
#
# What it shows (times in seconds):
#   0-4      a black frame, then the kettle and the mug
#   4-16     a Bigelow Premium Green Tea packet held up to the camera (the
#            packet's artwork shows a cup of tea)
#   16-22    the kettle's lid opened, the kettle switched on
#   22.5-25.5  the display shows 176 while the button is pressed: the
#            kettle's target setting, not the water's temperature
#   26-321   the display rises from 73 to 171; an empty mug beside it
#   321-339  the display flickers between 170 and 176
#   339-346  the display reads 176
#   346-359  a tea bag put into the empty mug
#   359-364  water poured from the kettle into the mug
#   364-381  the tea bag steeps in the mug
# The kettle was filled before the recording started.
#
# Provenance: these times were derived from timestamped captions of the
# video at 1 frame per second (per-frame captions and semantic segments
# from a captioning pipeline), then each boundary was checked by looking at
# the frames around it. They are good to about a second, not frame-exact.

recording: green-tea-04
duration_s: 381
display_unit: fahrenheit  # the kettle shows no unit; 68 at room temperature
target_c: 80  # green tea: 176 degrees Fahrenheit on this display
