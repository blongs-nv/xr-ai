# Scripted replies for a plumbing run of run_steps.py and run_dialogue.py
# (--fakes): every call gets the same kind of answer, so the numbers mean
# nothing.
decide:
  by_prompt:
    - ["change the procedure now", none]
    - ["Which option fits", conversation]
  otherwise: negative
perceive:
  by_prompt:
    - ["Is a tea package, bag or tag", {look: {tea_package_in_view: true, text_on_package: [Bigelow, Green Tea], brand: {quote: Bigelow, value: Bigelow}, tea_type: {quote: Green Tea, value: green}, directions: {brewing_directions_visible: false}}}]
    - ["Is a lit digital temperature display", {look: {display_in_view: true, display_is_on: kettle, display_kind: lit digital digits, where_in_image: center, text_on_display: ["150."], reading: {evidence: the display, shown_as: "150.", digits: "150"}, unit: {unit_letter_visible: false}, marked_as: {evidence: nothing, answer: not shown}}}]
  otherwise: A kettle and a mug on a desk.
answer_with_reasoning:
  by_prompt:
    - ["Fill in conventional brewing settings", {output: {water_temperature: {value: 80, unit: celsius}, steep_time: {minimum_minutes: 2, maximum_minutes: 2}}}]
    - ["what is the check missing", {missing: the unit, action: ask, words: "Does the display show Celsius or Fahrenheit?"}]
  otherwise: You're on reading the label; next, fill the kettle with water.
