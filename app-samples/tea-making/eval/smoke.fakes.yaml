# Scripted replies for a plumbing run of harness.py (--fakes): every call
# gets the same kind of answer, so the numbers mean nothing.
decide:
  by_prompt:
    - ["change the procedure now", none]
    - ["Which option fits", conversation]
  otherwise: negative
perceive:
  by_prompt:
    - ["Read only clearly legible text", {tea_name: Bigelow, tea_type: green tea}]
    - ["Transcribe the number", {value: 150, role: current}]
  otherwise: A kettle and a mug on a desk.
perceive_with_reasoning:
  by_prompt:
    - ["camera may not establish", {ask: true, question: "Does the display show Celsius or Fahrenheit?", reason: no unit}]
  otherwise: {ask: false, reason: nothing to ask}
answer_with_reasoning:
  otherwise: You're on reading the label; next, fill the kettle with water.
