# Scripted replies for a smoke run of step_eval.py (--fakes): every frame
# gets the same answers, so this checks the plumbing, not accuracy.
decision:
  by_prompt:
    - ["Has the water reached", negative]
  otherwise: positive
vlm:
  by_prompt:
    - ["Read only clearly legible text", {tea_name: Bigelow, tea_type: green tea}]
    - ["Transcribe the number", {value: 150}]
  otherwise: A mug with a tea bag in hot water.
