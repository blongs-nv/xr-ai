# Heating the water to 80 C: 176 on this kettle's display, which prints no
# unit (Fahrenheit), so the step can judge a reading only once the person
# has said the unit: in the conversation before or during the step (its
# escalator reads the conversation), or when its escalator asks. Scenes are
# times in recordings/green-tea-04.yaml.
step: heat_water
inputs: {target: {value: 80, unit: celsius}}
cases:
  # The person answers the unit question; the check then completes at 176.
  - name: unit_unknown_then_answered
    scene: [26, 346]
    person: {answers: [Fahrenheit]}
    expect:
      asks: [unit, celsius, fahrenheit]
      completes: {after: 330}

  # Nobody answers: without a unit the check never decides.
  - name: unit_unknown_no_answer
    scene: [26, 130]
    expect: {asks: [unit, celsius, fahrenheit], completes: false}

  # Once told the unit, it watches while the water heats, below the target.
  - name: rising
    scene: [26, 321]
    person: {answers: [Fahrenheit]}
    expect: {asks: [unit, celsius, fahrenheit], completes: false}

  # The last stretch: asked the unit, then the display reaches 176.
  - name: at_target
    scene: [290, 346]
    person: {answers: [Fahrenheit]}
    expect: {asks: [unit, celsius, fahrenheit], completes: {after: 330}}

  # The person said the unit when the target was announced: the step has it
  # from the start, so nobody asks.
  - name: unit_said_earlier
    scene: [290, 346]
    conversation: |-
      user: let's make tea
      assistant: I read Bigelow Green Tea.
      assistant: I'll brew it at 80 degrees Celsius for 3 minutes.
      assistant: There's water in the kettle.
      assistant: Heat the water to 80 degrees Celsius, and keep the kettle's display in view.
      user: heads up, my kettle shows Fahrenheit
    expect: {quiet: true, completes: {after: 330}}

  # The person asked about Fahrenheit but never said what the kettle shows:
  # that is no unit, so the escalator still asks.
  - name: unit_only_talked_about
    scene: [26, 130]
    conversation: |-
      assistant: I'll brew it at 80 degrees Celsius for 3 minutes.
      assistant: Heat the water to 80 degrees Celsius, and keep the kettle's display in view.
      user: what's that in Fahrenheit?
      assistant: 80 degrees Celsius is 176 degrees Fahrenheit.
    expect: {asks: [unit, celsius, fahrenheit], completes: false}

  # Heating in view, then the person looks away for a minute (the packet
  # close up, then opening the tea bag). The escalator first asks the unit
  # (answered); still looking away, they are told to show the kettle, and do.
  - name: looked_away
    scene: [[26, 36], [5, 12], [5, 12], [5, 12], [5, 12], [5, 12], [5, 12], [5, 12], [5, 12], [346, 351], [346, 351]]
    person: {answers: [Fahrenheit], after_tell: [[36, 80]]}
    expect: {asks: [unit, celsius, fahrenheit], says: [kettle, display, view], completes: false}

  - name: setpoint_shown_unit_unknown
    scene: [20, 30]
    expect: {completes: false}
    why: >-
      176 shows at 22.5-25.5 s while the button is pressed; it is the
      kettle's target setting, not the water's temperature. With no unit
      known nothing is judged, so it cannot complete the step. (Once the
      unit is known the flash could: the watch README's known gap.)

  - name: label_held_up
    scene: [4, 16]
    expect: {completes: false}

  - name: steeping_kettle_still_hot
    scene: [364, 381]
    why: the kettle reads 176-182 at the edge of the view; either outcome is fine
