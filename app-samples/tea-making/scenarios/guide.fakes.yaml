# Scripted replies for guide.yaml; drop them with --real-models. The router,
# the guide's controls and every visual check share the decide role, so it
# answers by what it is asked (a decision's context, the request, is matched
# too); the first matching entry wins.
decide:
  by_prompt:
    - ["Which control of the procedure", start]
    - ["Is there water inside", positive]
    - ["Has the water reached", positive]
    - ["Does this observation establish tea", positive]
    - ["What step am I on", conversation]
    - ["make tea", tea]
  otherwise: conversation
perceive:
  by_prompt:
    - ["Read only clearly legible text", {tea_name: Bicelon, tea_type: green tea}]
    - ["water is visibly inside", "The kettle holds water; its level shows in the window."]
    - ["Transcribe the number", {value: 176, unit_text: "°F", role: unknown}]
    - ["tea-water contact", "A tea bag hangs in the mug and touches the hot water."]
answer_with_reasoning:
  by_prompt:
    - ["Recommend conventional brewing settings", {temperature_c: 80, duration_s: 120}]
  otherwise: You're on filling the kettle with water.
