[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-procedures"
version = "0.0.1"
description = "Procedure (SOP) kit on xr-ai-app: capture a demonstrated procedure as an evidence packet, and guide someone through an approved one with camera checks."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "xr-ai-kit",
    "xr-ai-app",
]

# The devkit's `exercise` finds the `step:` and `procedure:` target kinds here.
[project.entry-points."xr_ai_app.exercise_targets"]
step = "xr_ai_procedures.exercise:resolve_step"
procedure = "xr_ai_procedures.exercise:resolve_procedure"

[tool.uv.sources]
xr-ai-app = { path = "../xr-ai-app", editable = true }
xr-ai-kit = { path = "../xr-ai-kit", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_procedures"]
