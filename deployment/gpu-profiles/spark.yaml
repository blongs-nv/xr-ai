# Shared GPU placement for one DGX Spark (unified memory).
# Replaces the per-sample model-servers/yaml/spark.yaml files; see dual_48G_ada.yaml.
speaker-stt:
  cuda_visible_devices: '0'
stt:
  cuda_visible_devices: '0'
tts:
  cuda_visible_devices: '0'
omni:
  max_num_seqs: 4
  gpu_memory_utilization: 0.25
  kv_cache_memory_bytes: 2147483648
  spark_uma: true
vlm:
  gpu_memory_utilization: 0.2
  kv_cache_memory_bytes: 1610612736
  max_num_seqs: 4
  spark_uma: true
clef: {}
embedding:
  gpu_memory_utilization: 0.08
  spark_uma: true
  # NGC 26.09 had incompatible FlashAttention kernels on GB10 SM121/driver 580.
  # Retain Triton pending NGC 26.10 preview qualification on this profile.
  attention_backend: TRITON_ATTN
# Optional servers (GPU placement provisional until measured): nano replaces omni as the answer
# model, so it takes omni's share; magpie and ocr sit next to the other small servers.
magpie:
  cuda_visible_devices: '0'
nano:
  max_num_seqs: 4
  gpu_memory_utilization: 0.25
  kv_cache_memory_bytes: 2147483648
  spark_uma: true
ocr:
  cuda_visible_devices: '0'
