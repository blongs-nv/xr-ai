[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-eval"
version = "0.1.0"
description = "One runner and result format for every xr-ai eval."
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
xr-ai-eval = "xr_ai_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_eval"]
