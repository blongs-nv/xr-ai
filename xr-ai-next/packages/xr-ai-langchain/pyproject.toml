[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-langchain"
version = "0.0.1"
description = "Optional LangChain and LangGraph adapters for xr-ai-next: roles as chat models, tools both ways, graphs as delegate back ends."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.10",
    "xr-ai-kit",
    "xr-ai-next",
]

[tool.uv.sources]
xr-ai-kit    = { path = "../xr-ai-kit", editable = true }
xr-ai-next   = { path = "../xr-ai-next", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_langchain"]
