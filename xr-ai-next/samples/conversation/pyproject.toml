# One uv project for the launcher (main.py: DeviceIOHub + the app) and the
# app (app.py and its modules). Run from this directory; see README.md.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-next-sample-conversation"
version = "0.1.0"
description = "Routed conversation, current view, notes and a visual alert, on the xr-ai-next core and kit."
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2",
    "xr-ai-kit",
    "xr-ai-launcher",
    "xr-ai-logging",
    "xr-ai-next",
]

[dependency-groups]
# `uv run pytest`
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.uv.sources]
xr-ai-kit      = { path = "../../packages/xr-ai-kit", editable = true }
xr-ai-launcher = { path = "../../../utils/xr-ai-launcher", editable = true }
xr-ai-logging  = { path = "../../../utils/xr-ai-logging", editable = true }
xr-ai-next     = { path = "../../packages/xr-ai-next", editable = true }

[project.scripts]
conversation = "main:run"
conversation_app = "app:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "app.py",
    "current_view.py",
    "note_taking.py",
    "visual_alert.py",
]
