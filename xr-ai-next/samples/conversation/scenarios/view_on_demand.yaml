# No video stream: the web client in on-demand camera mode. The camera holds
# the picture and hands it over only when the app asks; the transcript shows
# the capture.
name: question about the view, picture on demand
participant: p1
steps:
  - join: p1
  - image: {path: media/sign_closed.png, stream: false}
  - at: 0.5
    say: What does the sign say?
  - expect: {said: closed, within_s: 60}
  - leave: p1
