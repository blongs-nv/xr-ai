# What this sample needs from the repository and from PyPI. Run from this directory with
# `uv run ...` (see ../README.md); uv installs exactly this.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-next-sample-vision-qa"
version = "0.1.0"
description = "xr-ai-next sample 02: A conversation with a camera tool."
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.10",
    "xr-ai-kit",
    "xr-ai-next",
]

[dependency-groups]
# `uv run pytest test_app.py`
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.uv.sources]
xr-ai-kit       = { path = "../../../packages/xr-ai-kit", editable = true }
xr-ai-next      = { path = "../../../packages/xr-ai-next", editable = true }

[project.scripts]
vision_qa_app = "app:app.run"

[tool.hatch.build.targets.wheel]
only-include = ["app.py"]
