# What this sample needs from the repository and from PyPI. Run from this directory with
# `uv run ...` (see ../README.md); uv installs exactly this.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-next-sample-guided-procedure"
version = "0.1.0"
description = "xr-ai-next sample 10: A spoken checklist the camera verifies."
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.10",
    "xr-ai-kit",
    "xr-ai-next[video]",
    "xr-ai-procedures",
]

[tool.uv.sources]
xr-ai-kit        = { path = "../../../packages/xr-ai-kit", editable = true }
xr-ai-next       = { path = "../../../packages/xr-ai-next", editable = true }
xr-ai-procedures = { path = "../../../packages/xr-ai-procedures", editable = true }

[project.scripts]
guided_procedure_app = "app:app.run"

[tool.hatch.build.targets.wheel]
only-include = ["app.py"]
