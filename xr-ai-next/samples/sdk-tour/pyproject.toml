# The launcher for every sample in this folder (launch.py): DeviceIOHub, then
# the app of the sample named on the command line, which stays its own uv
# project (NN-name/pyproject.toml). Run from this directory; see README.md.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-next-samples-sdk-tour"
version = "0.1.0"
description = "Runs any xr-ai-next SDK tour sample on DeviceIOHub."
requires-python = ">=3.11,<3.15"
dependencies = [
    "xr-ai-launcher",
    "xr-ai-logging",
]

[tool.uv.sources]
xr-ai-launcher = { path = "../../../utils/xr-ai-launcher", editable = true }
xr-ai-logging  = { path = "../../../utils/xr-ai-logging", editable = true }

[project.scripts]
"sdk-tour" = "launch:main"

[tool.hatch.build.targets.wheel]
only-include = ["launch.py"]
